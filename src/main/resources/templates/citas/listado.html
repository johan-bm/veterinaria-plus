<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{cita.titulo}">Gestión de Citas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div th:replace="~{fragmentos/navegacion :: navegacion}"></div>
<div th:replace="~{fragmentos/alertas :: alertas}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="#{cita.titulo}">Gestión de Citas</h2>
        <a th:href="@{/citas/nuevo}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> <span th:text="#{cita.nueva}">Nueva cita</span>
        </a>
    </div>

    <div th:if="${citas.isEmpty()}" class="alert alert-info" th:text="#{mensaje.sinDatos}">
        No hay datos para mostrar
    </div>

    <div th:unless="${citas.isEmpty()}" class="table-responsive">
        <table class="table table-hover table-striped bg-white shadow-sm">
            <thead>
            <tr>
                <th th:text="#{cita.mascota}">Mascota</th>
                <th th:text="#{cita.veterinario}">Veterinario</th>
                <th th:text="#{cita.fecha}">Fecha</th>
                <th th:text="#{cita.horaInicio}">Hora de inicio</th>
                <th th:text="#{cita.estado}">Estado</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cita : ${citas}">
                <td th:text="${cita.mascota.nombre}"></td>
                <td th:text="${cita.veterinario.nombreCompleto}"></td>
                <td th:text="${#temporals.format(cita.fechaCita, 'dd/MM/yyyy')}"></td>
                <td th:text="${#temporals.format(cita.horaInicio, 'HH:mm')} + ' - ' + ${#temporals.format(cita.horaFin, 'HH:mm')}"></td>
                <td>
                    <span class="badge" th:class="'badge badge-estado-' + ${cita.estado}"
                          th:text="#{${'estado.' + cita.estado}}"></span>
                </td>
                <td class="text-end">
                    <a th:if="${cita.estado.name() != 'CANCELADA' and cita.estado.name() != 'COMPLETADA'}"
                       th:href="@{/citas/{id}/editar(id=${cita.id})}"
                       class="btn btn-sm btn-outline-primary" th:title="#{accion.editar}">
                        <i class="bi bi-pencil"></i>
                    </a>

                    <form th:if="${cita.estado.name() == 'AGENDADA'}"
                          th:action="@{/citas/{id}/confirmar(id=${cita.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-outline-success" th:title="#{cita.confirmado.exito}">
                            <i class="bi bi-check-lg"></i>
                        </button>
                    </form>

                    <form th:if="${cita.estado.name() == 'CONFIRMADA'}"
                          th:action="@{/citas/{id}/completar(id=${cita.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-outline-info" th:title="#{cita.completado.exito}">
                            <i class="bi bi-clipboard-check"></i>
                        </button>
                    </form>

                    <form th:if="${cita.estado.name() != 'CANCELADA' and cita.estado.name() != 'COMPLETADA'}"
                          th:action="@{/citas/{id}/cancelar(id=${cita.id})}" method="post" class="d-inline"
                          onsubmit="return confirm(this.dataset.confirmMsg)"
                          th:data-confirm-msg="#{mensaje.confirmarEliminar}">
                        <button type="submit" class="btn btn-sm btn-outline-danger" th:title="#{accion.cancelar}">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
