<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{cita.titulo}">Gestión de Citas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div th:replace="~{fragmentos/navegacion :: navegacion}"></div>
<div th:replace="~{fragmentos/alertas :: alertas}"></div>

<div class="container py-4">
    <h2 class="mb-4" th:text="${citaDto.id == null} ? #{cita.nueva} : #{accion.editar}">
        Nueva cita
    </h2>

    <form th:action="@{/citas/guardar}" th:object="${citaDto}" method="post"
          class="card shadow-sm border-0 p-4" style="max-width: 600px;">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label" th:text="#{cita.mascota}">Mascota</label>
            <select th:field="*{mascotaId}" class="form-select"
                    th:classappend="${#fields.hasErrors('mascotaId')} ? 'is-invalid'">
                <option value="" th:text="#{accion.seleccione}">Seleccione...</option>
                <option th:each="mascota : ${mascotas}" th:value="${mascota.id}"
                        th:text="${mascota.nombre} + ' (' + ${mascota.propietario.nombreCompleto} + ')'"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('mascotaId')}" th:errors="*{mascotaId}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" th:text="#{cita.veterinario}">Veterinario</label>
            <select th:field="*{veterinarioId}" class="form-select"
                    th:classappend="${#fields.hasErrors('veterinarioId')} ? 'is-invalid'">
                <option value="" th:text="#{accion.seleccione}">Seleccione...</option>
                <option th:each="vet : ${veterinarios}" th:value="${vet.id}" th:text="${vet.nombreCompleto}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('veterinarioId')}" th:errors="*{veterinarioId}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" th:text="#{cita.fecha}">Fecha</label>
            <input type="date" th:field="*{fechaCita}" class="form-control"
                   th:classappend="${#fields.hasErrors('fechaCita')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaCita')}" th:errors="*{fechaCita}"></div>
        </div>

        <div class="row">
            <div class="col-6 mb-3">
                <label class="form-label" th:text="#{cita.horaInicio}">Hora de inicio</label>
                <input type="time" th:field="*{horaInicio}" class="form-control"
                       th:classappend="${#fields.hasErrors('horaInicio')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('horaInicio')}" th:errors="*{horaInicio}"></div>
            </div>
            <div class="col-6 mb-3">
                <label class="form-label" th:text="#{cita.horaFin}">Hora de fin</label>
                <input type="time" th:field="*{horaFin}" class="form-control"
                       th:classappend="${#fields.hasErrors('horaFin')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('horaFin')}" th:errors="*{horaFin}"></div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label" th:text="#{cita.motivo}">Motivo</label>
            <textarea th:field="*{motivo}" class="form-control" rows="3"
                      th:classappend="${#fields.hasErrors('motivo')} ? 'is-invalid'"></textarea>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('motivo')}" th:errors="*{motivo}"></div>
        </div>

        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary" th:text="#{accion.guardar}">Guardar</button>
            <a th:href="@{/citas}" class="btn btn-outline-secondary" th:text="#{accion.cancelar}">Cancelar</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
