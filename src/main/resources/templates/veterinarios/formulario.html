<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{veterinario.titulo}">Gestión de Veterinarios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div th:replace="~{fragmentos/navegacion :: navegacion}"></div>
<div th:replace="~{fragmentos/alertas :: alertas}"></div>

<div class="container py-4">
    <h2 class="mb-4" th:text="${veterinarioForm.id == null} ? #{veterinario.nuevo} : #{accion.editar}">
        Nuevo veterinario
    </h2>

    <form th:action="@{/veterinarios/guardar}" th:object="${veterinarioForm}" method="post"
          class="card shadow-sm border-0 p-4" style="max-width: 600px;">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label" th:text="#{veterinario.nombre}">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control"
                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" th:text="#{veterinario.apellido}">Apellido</label>
            <input type="text" th:field="*{apellido}" class="form-control"
                   th:classappend="${#fields.hasErrors('apellido')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" th:text="#{veterinario.cedulaProfesional}">Cédula profesional</label>
            <input type="text" th:field="*{cedulaProfesional}" class="form-control"
                   th:classappend="${#fields.hasErrors('cedulaProfesional')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('cedulaProfesional')}" th:errors="*{cedulaProfesional}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" th:text="#{veterinario.especialidad}">Especialidad</label>
            <select th:field="*{especialidadId}" class="form-select"
                    th:classappend="${#fields.hasErrors('especialidadId')} ? 'is-invalid'">
                <option value="" th:text="#{accion.seleccione}">Seleccione...</option>
                <option th:each="esp : ${especialidades}" th:value="${esp.id}" th:text="${esp.nombre}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('especialidadId')}" th:errors="*{especialidadId}"></div>
        </div>

        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary" th:text="#{accion.guardar}">Guardar</button>
            <a th:href="@{/veterinarios}" class="btn btn-outline-secondary" th:text="#{accion.cancelar}">Cancelar</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
