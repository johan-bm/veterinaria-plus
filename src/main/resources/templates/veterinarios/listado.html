<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{veterinario.titulo}">Gestión de Veterinarios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div th:replace="~{fragmentos/navegacion :: navegacion}"></div>
<div th:replace="~{fragmentos/alertas :: alertas}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="#{veterinario.titulo}">Gestión de Veterinarios</h2>
        <a th:href="@{/veterinarios/nuevo}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> <span th:text="#{veterinario.nuevo}">Nuevo veterinario</span>
        </a>
    </div>

    <div th:if="${veterinarios.isEmpty()}" class="alert alert-info" th:text="#{mensaje.sinDatos}">
        No hay datos para mostrar
    </div>

    <div th:unless="${veterinarios.isEmpty()}" class="table-responsive">
        <table class="table table-hover table-striped bg-white shadow-sm">
            <thead>
            <tr>
                <th th:text="#{veterinario.nombre}">Nombre</th>
                <th th:text="#{veterinario.cedulaProfesional}">Cédula profesional</th>
                <th th:text="#{veterinario.especialidad}">Especialidad</th>
                <th th:text="#{veterinario.activo}">Activo</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="veterinario : ${veterinarios}">
                <td th:text="${veterinario.nombreCompleto}"></td>
                <td th:text="${veterinario.cedulaProfesional}"></td>
                <td th:text="${veterinario.especialidad.nombre}"></td>
                <td>
                    <span th:if="${veterinario.activo}" class="badge bg-success">
                        <i class="bi bi-check-lg"></i>
                    </span>
                    <span th:unless="${veterinario.activo}" class="badge bg-secondary">
                        <i class="bi bi-x-lg"></i>
                    </span>
                </td>
                <td class="text-end">
                    <a th:href="@{/veterinarios/{id}/editar(id=${veterinario.id})}"
                       class="btn btn-sm btn-outline-primary" th:title="#{accion.editar}">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <form th:if="${veterinario.activo}"
                          th:action="@{/veterinarios/{id}/eliminar(id=${veterinario.id})}" method="post"
                          class="d-inline" onsubmit="return confirm(this.dataset.confirmMsg)"
                          th:data-confirm-msg="#{mensaje.confirmarEliminar}">
                        <button type="submit" class="btn btn-sm btn-outline-danger" th:title="#{accion.eliminar}">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
