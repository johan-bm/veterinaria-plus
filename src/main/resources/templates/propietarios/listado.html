<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{propietario.titulo}">Gestión de Propietarios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div th:replace="~{fragmentos/navegacion :: navegacion}"></div>
<div th:replace="~{fragmentos/alertas :: alertas}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="#{propietario.titulo}">Gestión de Propietarios</h2>
        <a th:href="@{/propietarios/nuevo}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> <span th:text="#{propietario.nuevo}">Nuevo propietario</span>
        </a>
    </div>

    <form th:action="@{/propietarios}" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="texto" class="form-control" th:value="${textoBusqueda}"
                   th:placeholder="#{accion.buscar}">
            <button type="submit" class="btn btn-outline-secondary">
                <i class="bi bi-search"></i>
            </button>
        </div>
    </form>

    <div th:if="${propietarios.isEmpty()}" class="alert alert-info" th:text="#{mensaje.sinDatos}">
        No hay datos para mostrar
    </div>

    <div th:unless="${propietarios.isEmpty()}" class="table-responsive">
        <table class="table table-hover table-striped bg-white shadow-sm">
            <thead>
            <tr>
                <th th:text="#{propietario.nombre}">Nombre</th>
                <th th:text="#{propietario.apellido}">Apellido</th>
                <th th:text="#{propietario.telefono}">Teléfono</th>
                <th th:text="#{propietario.email}">Correo electrónico</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="propietario : ${propietarios}">
                <td th:text="${propietario.nombre}"></td>
                <td th:text="${propietario.apellido}"></td>
                <td th:text="${propietario.telefono}"></td>
                <td th:text="${propietario.email}"></td>
                <td class="text-end">
                    <a th:href="@{/propietarios/{id}/editar(id=${propietario.id})}"
                       class="btn btn-sm btn-outline-primary" th:title="#{accion.editar}">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <form th:action="@{/propietarios/{id}/eliminar(id=${propietario.id})}" method="post"
                          class="d-inline" onsubmit="return confirm(this.dataset.confirmMsg)"
                          th:data-confirm-msg="#{mensaje.confirmarEliminar}">
                        <button type="submit" class="btn btn-sm btn-outline-danger" th:title="#{accion.eliminar}">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
