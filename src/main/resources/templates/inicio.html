<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{app.nombre}">Veterinaria+</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div th:replace="~{fragmentos/navegacion :: navegacion}"></div>
<div th:replace="~{fragmentos/alertas :: alertas}"></div>

<div class="container py-5">
    <div class="text-center mb-5">
        <i class="bi bi-heart-pulse-fill text-primary" style="font-size: 3.5rem;"></i>
        <h1 class="mt-3" th:text="#{inicio.titulo}">Bienvenido a Veterinaria+</h1>
        <p class="lead text-muted" th:text="#{inicio.subtitulo}">
            Sistema integral de gestión para tu clínica veterinaria
        </p>
    </div>

    <div class="row g-4">
        <div class="col-md-4 col-lg-2">
            <a th:href="@{/propietarios}" class="card text-decoration-none h-100 shadow-sm border-0">
                <div class="card-body text-center">
                    <i class="bi bi-people-fill text-primary" style="font-size: 2rem;"></i>
                    <h6 class="card-title mt-2" th:text="#{nav.propietarios}">Propietarios</h6>
                </div>
            </a>
        </div>
        <div class="col-md-4 col-lg-2">
            <a th:href="@{/mascotas}" class="card text-decoration-none h-100 shadow-sm border-0">
                <div class="card-body text-center">
                    <i class="bi bi-bandaid-fill text-success" style="font-size: 2rem;"></i>
                    <h6 class="card-title mt-2" th:text="#{nav.mascotas}">Mascotas</h6>
                </div>
            </a>
        </div>
        <div class="col-md-4 col-lg-2">
            <a th:href="@{/veterinarios}" class="card text-decoration-none h-100 shadow-sm border-0">
                <div class="card-body text-center">
                    <i class="bi bi-person-badge-fill text-info" style="font-size: 2rem;"></i>
                    <h6 class="card-title mt-2" th:text="#{nav.veterinarios}">Veterinarios</h6>
                </div>
            </a>
        </div>
        <div class="col-md-4 col-lg-2">
            <a th:href="@{/citas}" class="card text-decoration-none h-100 shadow-sm border-0">
                <div class="card-body text-center">
                    <i class="bi bi-calendar-check-fill text-warning" style="font-size: 2rem;"></i>
                    <h6 class="card-title mt-2" th:text="#{nav.citas}">Citas</h6>
                </div>
            </a>
        </div>
        <div class="col-md-4 col-lg-2">
            <a th:href="@{/medicamentos}" class="card text-decoration-none h-100 shadow-sm border-0">
                <div class="card-body text-center">
                    <i class="bi bi-capsule text-danger" style="font-size: 2rem;"></i>
                    <h6 class="card-title mt-2" th:text="#{nav.medicamentos}">Medicamentos</h6>
                </div>
            </a>
        </div>
        <div class="col-md-4 col-lg-2">
            <a th:href="@{/reportes}" class="card text-decoration-none h-100 shadow-sm border-0">
                <div class="card-body text-center">
                    <i class="bi bi-bar-chart-fill text-secondary" style="font-size: 2rem;"></i>
                    <h6 class="card-title mt-2" th:text="#{nav.reportes}">Reportes</h6>
                </div>
            </a>
        </div>
    </div>

    <!-- Alertas de stock bajo, visibles desde el inicio -->
    <div th:if="${medicamentosStockBajo != null and !medicamentosStockBajo.isEmpty()}" class="mt-5">
        <div class="alert alert-warning">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <strong th:text="#{medicamento.alerta.stockBajo}">Stock por debajo del mínimo</strong>:
            <span th:each="med, iter : ${medicamentosStockBajo}">
                <span th:text="${med.nombre}"></span><span th:if="!${iter.last}">, </span>
            </span>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
