<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{reporte.titulo}">Reportes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div th:replace="~{fragmentos/navegacion :: navegacion}"></div>
<div th:replace="~{fragmentos/alertas :: alertas}"></div>

<div class="container py-4">
    <h2 class="mb-4" th:text="#{reporte.titulo}">Reportes</h2>

    <div class="card shadow-sm border-0 p-4" style="max-width: 600px;">
        <h5 th:text="#{reporte.citasPorPeriodo}">Citas por período</h5>
        <form th:action="@{/reportes/citas-por-periodo}" method="get" class="mt-3">
            <div class="row">
                <div class="col-6 mb-3">
                    <label class="form-label" th:text="#{reporte.fechaInicio}">Fecha de inicio</label>
                    <input type="date" name="fechaInicio" th:value="${fechaInicio}" class="form-control" required>
                </div>
                <div class="col-6 mb-3">
                    <label class="form-label" th:text="#{reporte.fechaFin}">Fecha de fin</label>
                    <input type="date" name="fechaFin" th:value="${fechaFin}" class="form-control" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" th:text="#{reporte.generar}">Generar reporte</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
