<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{reporte.titulo}">Reportes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div th:replace="~{fragmentos/navegacion :: navegacion}"></div>
<div th:replace="~{fragmentos/alertas :: alertas}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="#{reporte.citasPorPeriodo}">Citas por período</h2>
        <a th:href="@{/reportes}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> <span th:text="#{accion.volver}">Volver</span>
        </a>
    </div>

    <p class="text-muted">
        <span th:text="${#temporals.format(fechaInicio, 'dd/MM/yyyy')}"></span>
        &mdash;
        <span th:text="${#temporals.format(fechaFin, 'dd/MM/yyyy')}"></span>
    </p>

    <!-- Estadisticas rapidas por estado -->
    <div class="row g-3 mb-4">
        <div class="col-md-3" th:each="entrada : ${estadisticas}">
            <div class="card text-center shadow-sm border-0">
                <div class="card-body">
                    <h3 th:text="${entrada.value}"></h3>
                    <p class="text-muted mb-0" th:text="#{${'estado.' + entrada.key}}"></p>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${citas.isEmpty()}" class="alert alert-info" th:text="#{reporte.sinResultados}">
        No se encontraron resultados para el período seleccionado
    </div>

    <div th:unless="${citas.isEmpty()}" class="table-responsive">
        <table class="table table-hover table-striped bg-white shadow-sm">
            <thead>
            <tr>
                <th th:text="#{cita.mascota}">Mascota</th>
                <th th:text="#{cita.veterinario}">Veterinario</th>
                <th th:text="#{cita.fecha}">Fecha</th>
                <th th:text="#{cita.horaInicio}">Hora de inicio</th>
                <th th:text="#{cita.estado}">Estado</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cita : ${citas}">
                <td th:text="${cita.nombreMascota}"></td>
                <td th:text="${cita.nombreVeterinario}"></td>
                <td th:text="${#temporals.format(cita.fechaCita, 'dd/MM/yyyy')}"></td>
                <td th:text="${#temporals.format(cita.horaInicio, 'HH:mm')}"></td>
                <td>
                    <span class="badge" th:class="'badge badge-estado-' + ${cita.estado}"
                          th:text="#{${'estado.' + cita.estado}}"></span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
