<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{mascota.titulo}">Gestión de Mascotas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div th:replace="~{fragmentos/navegacion :: navegacion}"></div>
<div th:replace="~{fragmentos/alertas :: alertas}"></div>

<div class="container py-4">
    <h2 class="mb-4" th:text="${mascotaDto.id == null} ? #{mascota.nuevo} : #{accion.editar}">
        Nueva mascota
    </h2>

    <form th:action="@{/mascotas/guardar}" th:object="${mascotaDto}" method="post"
          class="card shadow-sm border-0 p-4" style="max-width: 600px;">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label" th:text="#{mascota.nombre}">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control"
                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" th:text="#{mascota.especie}">Especie</label>
            <select th:field="*{especieId}" class="form-select"
                    th:classappend="${#fields.hasErrors('especieId')} ? 'is-invalid'">
                <option value="" th:text="#{accion.seleccione}">Seleccione...</option>
                <option th:each="especie : ${especies}" th:value="${especie.id}" th:text="${especie.nombre}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('especieId')}" th:errors="*{especieId}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" th:text="#{mascota.raza}">Raza</label>
            <input type="text" th:field="*{raza}" class="form-control"
                   th:classappend="${#fields.hasErrors('raza')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('raza')}" th:errors="*{raza}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" th:text="#{mascota.fechaNacimiento}">Fecha de nacimiento</label>
            <input type="date" th:field="*{fechaNacimiento}" class="form-control"
                   th:classappend="${#fields.hasErrors('fechaNacimiento')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" th:text="#{mascota.sexo}">Sexo</label>
            <select th:field="*{sexo}" class="form-select">
                <option th:each="sexo : ${sexos}" th:value="${sexo}" th:text="#{${'sexo.' + sexo}}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label" th:text="#{mascota.propietario}">Propietario</label>
            <select th:field="*{propietarioId}" class="form-select"
                    th:classappend="${#fields.hasErrors('propietarioId')} ? 'is-invalid'">
                <option value="" th:text="#{accion.seleccione}">Seleccione...</option>
                <option th:each="propietario : ${propietarios}" th:value="${propietario.id}"
                        th:text="${propietario.nombreCompleto}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('propietarioId')}" th:errors="*{propietarioId}"></div>
        </div>

        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary" th:text="#{accion.guardar}">Guardar</button>
            <a th:href="@{/mascotas}" class="btn btn-outline-secondary" th:text="#{accion.cancelar}">Cancelar</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
