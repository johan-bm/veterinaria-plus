<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{medicamento.titulo}">Gestión de Medicamentos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div th:replace="~{fragmentos/navegacion :: navegacion}"></div>
<div th:replace="~{fragmentos/alertas :: alertas}"></div>

<div class="container py-4">
    <h2 class="mb-4" th:text="${medicamento.id == null} ? #{medicamento.nuevo} : #{accion.editar}">
        Nuevo medicamento
    </h2>

    <form th:action="@{/medicamentos/guardar}" th:object="${medicamento}" method="post"
          class="card shadow-sm border-0 p-4" style="max-width: 600px;">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label" th:text="#{medicamento.nombre}">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control"
                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" th:text="#{medicamento.principioActivo}">Principio activo</label>
            <input type="text" th:field="*{principioActivo}" class="form-control"
                   th:classappend="${#fields.hasErrors('principioActivo')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('principioActivo')}" th:errors="*{principioActivo}"></div>
        </div>

        <div class="row">
            <div class="col-6 mb-3">
                <label class="form-label" th:text="#{medicamento.stock}">Existencias</label>
                <input type="number" th:field="*{stock}" class="form-control" min="0"
                       th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
            </div>
            <div class="col-6 mb-3">
                <label class="form-label" th:text="#{medicamento.stockMinimo}">Existencias mínimas</label>
                <input type="number" th:field="*{stockMinimo}" class="form-control" min="0"
                       th:classappend="${#fields.hasErrors('stockMinimo')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('stockMinimo')}" th:errors="*{stockMinimo}"></div>
            </div>
        </div>

        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary" th:text="#{accion.guardar}">Guardar</button>
            <a th:href="@{/medicamentos}" class="btn btn-outline-secondary" th:text="#{accion.cancelar}">Cancelar</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
