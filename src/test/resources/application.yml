# =========================================================
# Configuracion para pruebas automatizadas (JUnit).
# Usa H2 en memoria para que las pruebas corran rapido y sin
# depender de un contenedor Docker externo.
# =========================================================

spring:
  datasource:
    url: jdbc:h2:mem:veterinaria_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  messages:
    basename: i18n/mensajes, i18n/validacion
    encoding: UTF-8

logging:
  level:
    org.hibernate.SQL: WARN
    com.veterinariaplus: INFO
