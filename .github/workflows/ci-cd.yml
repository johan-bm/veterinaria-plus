name: CI/CD - Veterinaria+

# Se ejecuta en cada push y en cada pull request hacia main,
# cumpliendo el criterio de pipeline de despliegue de la rúbrica
# (versionamiento + build + pruebas + escaneo de cobertura + empaquetado).
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build-and-test:
    name: Build, pruebas unitarias y cobertura (JaCoCo)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar el proyecto
        run: mvn -B clean compile

      - name: Ejecutar pruebas unitarias (JUnit 5 + Mockito)
        run: mvn -B test

      - name: Generar y verificar reporte de cobertura JaCoCo (mínimo 80%)
        run: mvn -B jacoco:report jacoco:check

      - name: Publicar reporte de cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-jacoco
          path: target/site/jacoco/
          retention-days: 14

      - name: Publicar resultados de pruebas como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: target/surefire-reports/
          retention-days: 14

  build-docker-image:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker (sin publicar)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: veterinaria-plus:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
